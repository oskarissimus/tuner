<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Guitar Tuner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Main Tuner Section -->
        <div class="tuner-section">
            <div class="tuner-gauge">
                <div class="gauge-numbers">
                    <span class="gauge-num left-40">-40</span>
                    <span class="gauge-num left-30">-30</span>
                    <span class="gauge-num left-20">-20</span>
                    <span class="gauge-num left-10">-10</span>
                    <span class="gauge-num center">0</span>
                    <span class="gauge-num right-10">+10</span>
                    <span class="gauge-num right-20">+20</span>
                    <span class="gauge-num right-30">+30</span>
                    <span class="gauge-num right-40">+40</span>
                </div>
                
                <div class="gauge-ticks">
                    <!-- Tick marks will be generated by CSS -->
                </div>
                
                <div class="gauge-center">
                    <div class="brand-text">
                        <span class="pro-text">Pro</span>
                        <span class="guitar-text">Guitar</span>
                        <span class="tuner-text">Tuner</span>
                    </div>
                    
                    <div class="digital-display">
                        <span id="current-note">G</span>
                    </div>
                    
                    <div class="needle" id="tuner-needle"></div>
                </div>
                
                <div class="cent-label">cent</div>
            </div>
            
            <!-- Note Wheel -->
            <div class="note-wheel-section">
                <div class="note-wheel-label">Note wheel</div>
                <div class="note-wheel">
                    <div class="note-selector">
                        <div class="note-item">F#</div>
                        <div class="note-item active">G</div>
                        <div class="note-item">G#</div>
                        <div class="note-item">A</div>
                    </div>
                    <div class="note-wheel-handle"></div>
                </div>
                <div class="settings-icon">⚙</div>
            </div>
        </div>
        
        <!-- Guitar Fretboard -->
        <div class="fretboard-section">
            <div class="tuning-label">
                <div class="standard-text">Standard Guitar</div>
                <div class="tuning-text">Standard Tuning</div>
            </div>
            
            <div class="guitar-strings">
                <div class="string-row">
                    <div class="string-label">E₄</div>
                    <div class="string-line high-e"></div>
                    <div class="fret-markers">
                        <div class="fret-marker"></div>
                        <div class="fret-marker"></div>
                        <div class="fret-marker"></div>
                    </div>
                </div>
                
                <div class="string-row">
                    <div class="string-label">B₃</div>
                    <div class="string-line b"></div>
                    <div class="fret-markers">
                        <div class="fret-marker"></div>
                        <div class="fret-marker"></div>
                        <div class="fret-marker"></div>
                    </div>
                </div>
                
                <div class="string-row">
                    <div class="string-label">G₃</div>
                    <div class="string-line g"></div>
                    <div class="fret-markers">
                        <div class="fret-marker"></div>
                        <div class="fret-marker active-fret"></div>
                        <div class="fret-marker"></div>
                    </div>
                </div>
                
                <div class="string-row">
                    <div class="string-label">D₃</div>
                    <div class="string-line d"></div>
                    <div class="fret-markers">
                        <div class="fret-marker"></div>
                        <div class="fret-marker"></div>
                        <div class="fret-marker"></div>
                    </div>
                </div>
                
                <div class="string-row">
                    <div class="string-label">A₂</div>
                    <div class="string-line a"></div>
                    <div class="fret-markers">
                        <div class="fret-marker"></div>
                        <div class="fret-marker"></div>
                        <div class="fret-marker"></div>
                    </div>
                </div>
                
                <div class="string-row active-string">
                    <div class="string-label">E₂</div>
                    <div class="string-line low-e active"></div>
                    <div class="fret-markers">
                        <div class="fret-marker"></div>
                        <div class="fret-marker"></div>
                        <div class="fret-marker"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Bottom Navigation -->
        <div class="bottom-navigation">
            <div class="nav-item active">
                <div class="nav-icon tuner-icon">🎵</div>
                <div class="nav-label">Tuner</div>
            </div>
            
            <div class="nav-item">
                <div class="nav-icon">⚙</div>
                <div class="nav-label">Settings</div>
            </div>
            
            <div class="nav-item">
                <div class="nav-icon">♡</div>
                <div class="nav-label">Favorites</div>
            </div>
            
            <div class="nav-item">
                <div class="nav-icon">🎓</div>
                <div class="nav-label">Academy</div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
