[build]
  # No build step needed for this static app
  publish = "."
  
[build.environment]
  NODE_VERSION = "18"

[[headers]]
  # Headers for all routes
  for = "/*"
  [headers.values]
    # Enable HTTPS redirect for microphone access
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allow microphone access
    Permissions-Policy = "microphone=self"

[[headers]]
  # Cache static assets
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tuner.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  # Redirect all paths to index.html for SPA behavior
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {headers = {accept = "text/html"}}

# Development settings
[dev]
  command = "node server.js"
  port = 8080
  publish = "."